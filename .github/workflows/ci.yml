name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  windows:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    # Must stay above the Playwright CI test budget in playwright.config.js
    # plus install and build time, otherwise the job is killed before the test
    # can report its own failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Tiered: PRs run only the light smoke tests; the heavy ones (titles tagged
      # @full, see docs/testing.md) run on pushes to main and manual dispatch.
      - name: Browser smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke
      - name: Full browser tests
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
      # Failed tests keep a Playwright trace (see playwright.config.js). Without
      # uploading it the runner discards it, and a flaky CI failure leaves no
      # evidence beyond the job log.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
